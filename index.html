<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Creators Agency | Creative Agency — Social Media, Content & Audiovisual</title>
    <meta name="description" content="Agência criativa especializada em Social Media, Marketing Digital, Produção Audiovisual e Gestão de Creators. Transformamos ideias em conteúdo que aproxima marcas das pessoas." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clickcreators.agency/" />
    <meta property="og:title" content="Click Creators Agency | WE CREATE WHAT PEOPLE REMEMBER" />
    <meta property="og:description" content="Agência de Marketing Digital, Produção Audiovisual e Gestão de Criadores de Conteúdo." />
    <meta property="og:image" content="/img/Default_img.jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Click Creators Agency | WE CREATE WHAT PEOPLE REMEMBER" />
    <meta name="twitter:description" content="Agência de Marketing Digital, Produção Audiovisual e Gestão de Criadores de Conteúdo." />
    <meta name="twitter:image" content="/img/Default_img.jpeg" />

    <!-- Anti-FOUC: aplica o tema guardado antes do primeiro paint (default: dark) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("clickcreators-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
